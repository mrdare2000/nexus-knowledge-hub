<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="100%" height="100%" style="background:#0F172A; font-family:'Segoe UI', Roboto, sans-serif;">
  <rect width="1000" height="600" fill="#0F172A"/>
  <rect x="30" y="30" width="940" height="60" rx="10" fill="#1E3A8A"/>
  <text x="50" y="68" fill="#FFFFFF" font-size="22" font-weight="bold">TYPES OF SHIPPING CONTAINERS (ISO EQUIPMENT STANDARDS)</text>

  <g transform="translate(50, 120)">
    <rect width="270" height="200" rx="12" fill="#1E293B" stroke="#0284C7" stroke-width="2"/>
    <rect x="15" y="15" width="240" height="36" rx="6" fill="#0284C7"/>
    <text x="25" y="39" fill="#FFF" font-size="16" font-weight="bold">1. Dry Van (DV/GP)</text>
    <text x="15" y="75" fill="#E2E8F0" font-size="13" font-weight="bold">Standard ISO Fully Enclosed</text>
    <text x="15" y="98" fill="#94A3B8" font-size="12">â€¢ Rigid walls, roof &amp; end doors</text>
    <text x="15" y="118" fill="#94A3B8" font-size="12">â€¢ General dry goods, textiles, boxes</text>
    <text x="15" y="138" fill="#94A3B8" font-size="12">â€¢ Sizes: 20ft, 40ft, 40ft High Cube</text>
    <rect x="15" y="155" width="240" height="28" rx="6" fill="#0F172A"/>
    <text x="25" y="174" fill="#38BDF8" font-size="12" font-weight="bold">Most Common Cargo Equipment</text>
  </g>

  <g transform="translate(365, 120)">
    <rect width="270" height="200" rx="12" fill="#1E293B" stroke="#0D9488" stroke-width="2"/>
    <rect x="15" y="15" width="240" height="36" rx="6" fill="#0D9488"/>
    <text x="25" y="39" fill="#FFF" font-size="16" font-weight="bold">2. Reefer Container (RF)</text>
    <text x="15" y="75" fill="#E2E8F0" font-size="13" font-weight="bold">Temperature Controlled</text>
    <text x="15" y="98" fill="#94A3B8" font-size="12">â€¢ Range: -30C to +30C</text>
    <text x="15" y="118" fill="#94A3B8" font-size="12">â€¢ Perishable foods, pharma, fruits</text>
    <text x="15" y="138" fill="#94A3B8" font-size="12">â€¢ Vessel electrical plug required</text>
    <rect x="15" y="155" width="240" height="28" rx="6" fill="#0F172A"/>
    <text x="25" y="174" fill="#2DD4BF" font-size="12" font-weight="bold">Integrated Compressor Unit</text>
  </g>

  <g transform="translate(680, 120)">
    <rect width="270" height="200" rx="12" fill="#1E293B" stroke="#D97706" stroke-width="2"/>
    <rect x="15" y="15" width="240" height="36" rx="6" fill="#D97706"/>
    <text x="25" y="39" fill="#FFF" font-size="16" font-weight="bold">3. Open Top (OT)</text>
    <text x="15" y="75" fill="#E2E8F0" font-size="13" font-weight="bold">Top-Loading Crane Access</text>
    <text x="15" y="98" fill="#94A3B8" font-size="12">â€¢ Removable tarpaulin roof</text>
    <text x="15" y="118" fill="#94A3B8" font-size="12">â€¢ Oversized machinery, tall cargo</text>
    <text x="15" y="138" fill="#94A3B8" font-size="12">â€¢ Heavy steel beams, timber logs</text>
    <rect x="15" y="155" width="240" height="28" rx="6" fill="#0F172A"/>
    <text x="25" y="174" fill="#FBBF24" font-size="12" font-weight="bold">Overhead Gantry Loading</text>
  </g>

  <g transform="translate(180, 350)">
    <rect width="300" height="210" rx="12" fill="#1E293B" stroke="#DC2626" stroke-width="2"/>
    <rect x="15" y="15" width="270" height="36" rx="6" fill="#DC2626"/>
    <text x="25" y="39" fill="#FFF" font-size="16" font-weight="bold">4. Flat Rack (FR)</text>
    <text x="15" y="75" fill="#E2E8F0" font-size="13" font-weight="bold">Out-Of-Gauge (OOG) Cargo</text>
    <text x="15" y="98" fill="#94A3B8" font-size="12">â€¢ Collapsible end walls, no sides</text>
    <text x="15" y="118" fill="#94A3B8" font-size="12">â€¢ Yachts, oversized boilers, vehicles</text>
    <text x="15" y="138" fill="#94A3B8" font-size="12">â€¢ Heavy lashing ring attachments</text>
    <rect x="15" y="160" width="270" height="32" rx="6" fill="#0F172A"/>
    <text x="25" y="181" fill="#F87171" font-size="12" font-weight="bold">Specialized Project Cargo</text>
  </g>

  <g transform="translate(520, 350)">
    <rect width="300" height="210" rx="12" fill="#1E293B" stroke="#7C3AED" stroke-width="2"/>
    <rect x="15" y="15" width="270" height="36" rx="6" fill="#7C3AED"/>
    <text x="25" y="39" fill="#FFF" font-size="16" font-weight="bold">5. ISO Tank Container</text>
    <text x="15" y="75" fill="#E2E8F0" font-size="13" font-weight="bold">Bulk Liquids &amp; Chemicals</text>
    <text x="15" y="98" fill="#94A3B8" font-size="12">â€¢ Stainless steel pressure vessel</text>
    <text x="15" y="118" fill="#94A3B8" font-size="12">â€¢ Food spirits, oils, hazardous chemicals</text>
    <text x="15" y="138" fill="#94A3B8" font-size="12">â€¢ Mounted inside 20ft steel ISO frame</text>
    <rect x="15" y="160" width="270" height="32" rx="6" fill="#0F172A"/>
    <text x="25" y="181" fill="#C084FC" font-size="12" font-weight="bold">Bulk Liquid Transportation</text>
  </g>
</svg>