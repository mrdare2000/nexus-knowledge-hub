<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a192f"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7b00"/>
      <stop offset="100%" stop-color="#ff4500"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#ff4500" flood-opacity="0.35"/>
    </filter>
  </defs>
  
  <!-- Background Shield/Rounded Card -->
  <rect x="16" y="16" width="480" height="480" rx="100" fill="url(#bgGrad)"/>
  <rect x="24" y="24" width="464" height="464" rx="92" fill="none" stroke="#334155" stroke-width="8" opacity="0.6"/>
  
  <!-- Stylized Nexus "N" + Cargo Container Wings -->
  <g filter="url(#glow)">
    <!-- Left Pillar (Ocean / Maritime Blue) -->
    <path d="M128 368 V144 C128 135.163 135.163 128 144 128 H172 C178.627 128 184.417 132.092 186.58 138.337 L248 315 V368 H144 C135.163 368 128 360.837 128 352 Z" fill="url(#blueGrad)"/>
    
    <!-- Diagonal Connection & Right Pillar (Nexus Orange) -->
    <path d="M384 144 V368 C384 376.837 376.837 384 368 384 H340 C333.373 384 327.583 379.908 325.42 373.663 L264 197 V144 H368 C376.837 144 384 151.163 384 160 Z" fill="url(#orangeGrad)"/>
  </g>
  
  <!-- Speed / Global Trade Dynamic Accents -->
  <circle cx="256" cy="256" r="32" fill="#ffffff" opacity="0.95"/>
  <path d="M220 256 L292 256 M272 236 L292 256 L272 276" stroke="url(#orangeGrad)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
