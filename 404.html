<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Nexus Knowledge Hub | Redirecting...</title>
  <script>
    // SPA Fallback redirect for static servers
    var path = window.location.pathname.replace(/^\/|\/$/g, "");
    var hash = window.location.hash;
    if (path) {
      window.location.replace("/?page=" + encodeURIComponent(path) + hash);
    } else {
      window.location.replace("/");
    }
  </script>
</head>
<body style="background: #0f172a; color: #ffffff; font-family: system-ui, sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0;">
  <p style="opacity: 0.8;">Redirecting to Nexus Knowledge Hub...</p>
</body>
</html>
